# ==============================================================================
#  G1 校园数字共创系统 ·「时迁」跨平台配置文件（v9）
# ==============================================================================
#  【安全说明 · 请务必读一遍】
#  这个文件里**只有普通运行参数**（端口、音色、超时、动作池、阈值）。
#  绝不要在这里写 API Key、口令、PIN —— 一个字段都不要加。
#
#  密钥只从两个地方读（modules/secret_source.py）：
#      1. 环境变量（推荐，进程级、不落盘）
#            临时：  set SHIQIAN_ASR_KEY=sk-xxxx
#            永久：  setx  SHIQIAN_ASR_KEY sk-xxxx
#      2. 系统凭据库（更稳，只有本机本用户能解密）
#            python -c "import keyring;keyring.set_password('shiqian-g1','asr_key','sk-xxxx')"
#
#  下面各段里若出现 *_env 字段，那只是**变量名**，不是密钥本体。
#  本项目不使用固定种子派生加密密钥，也不往任何数据字段里写隐藏水印。
# ==============================================================================

system:
  # 运行模式选择：
  # "auto"       -> 强烈推荐！优先本地运行，失败自动切换云端接口
  # "local_only" -> 强制只用本地模型（断网可用，本地没开就退到离线模板）
  # "cloud_only" -> 强制只用云端接口（普通办公电脑可用）
  mode: "auto"

# ==============================================================================
# 大模型推理（本地 Qwen 优先，云端兜底）
# 这里只放路由策略；模型地址、模型名、云端 Key 由 tools/set_secret.py
# 写入本机保险箱，模块二会统一改为环境变量 / 系统凭据库。
# ==============================================================================
llm:
  # 本地模型健康探测：启动前先 GET {base_url}/models，1.2 秒没回就当没开机，
  # 直接走云端，避免每句话都干等 8 秒超时。
  local_probe: true
  local_probe_timeout: 1.2
  # 本地判定不可用后，多少秒内不再尝试（熔断），避免反复等待
  local_retry_seconds: 30

  # 生成参数（影响"记忆点"的风格）
  temperature: 0.4
  max_tokens: 120

  # 【可选】如果你的云端 Key 放在系统环境变量里，把变量名写在这里，
  # 程序启动时会自动导入进加密保险箱（导入后环境变量里的值不会被复制到任何文件）。
  # 留空表示不自动导入。
  cloud_api_key_env: ""

# ==============================================================================
# 动作池：现场实际录制了哪些 Pose，就填哪些，防止模型选到没录的动作
# A-Z 共 26 个位置，可以只放开一部分
# ==============================================================================
actions:
  allowed: "ABCDEFGH"
  names:
    A: "仰望星空"
    B: "挥手致意"
    C: "比心"
    D: "抱拳"
    E: "叉腰"
    F: "张开双臂"
    G: "低头沉思"
    H: "旋转半圈"

# ==============================================================================
# 动作执行与光影雕塑接口
# 接口地址在保险箱里（默认 http://localhost:8080/trigger_action/{action_id}）
# ==============================================================================
action:
  # http  -> 轻量 POST，最通用，推荐
  # ws    -> WebSocket，需要 pip install websocket-client
  # redis -> Redis 队列，需要 pip install redis 并启动 Redis 服务
  transport: "http"
  # 失败重试几次（0 = 不重试），每次间隔多少秒
  retries: 1
  retry_interval: 0.3
  timeout: 3.0
  # 机器人没开机时，指令先写进这个文件，等它上线自动补发
  queue_path: "data/action_queue.jsonl"
  queue_max: 200
  # WS / Redis 通道的参数（用不到就忽略）
  ws_url: "ws://127.0.0.1:8080/ws/actions"
  redis_url: "redis://127.0.0.1:6379/0"
  redis_key: "g1:actions"

# ==============================================================================
# 语音识别（ASR）：本地 Vosk 优先 -> 云端 API 兜底 -> 键盘输入兜底
# 云端 ASR 的密钥**不在本文件**：由环境变量 SHIQIAN_ASR_KEY 或系统凭据库提供
# （如要把变量名换个名字，写 key_env 字段 —— 只写变量名，不写值）
# ==============================================================================
asr:
  vosk_model_path: "models/vosk-model-small-cn-0.22"
  sample_rate: 16000
  # 多大声算"人声"（环境嘈杂就调大，安静教室 300 左右合适）
  energy_threshold: 300
  # 停顿多久算"这句话说完了"
  pause_threshold: 0.8
  # 环境噪音自动适应（教室人多时建议 true）
  dynamic_energy: true
  # 等第一句话最多几秒、单句话最长几秒
  listen_timeout: 8
  phrase_time_limit: 15
  # 没听到人声时重试几轮，之后给一次键盘输入机会
  max_rounds: 2
  fallback_to_keyboard: true
  # 云端识别地址（可留空；地址不是密钥，可以写在这里）
  cloud_asr_url: ""
  cloud_asr_model: "whisper-1"
  # 云端识别的超时（秒）：连不上就 3 秒放弃，读不回来 8 秒放弃 —— 超时即降级
  cloud_asr_connect_timeout: 3.0
  cloud_asr_timeout: 8.0
  # 若要覆盖默认环境变量名（默认 SHIQIAN_ASR_KEY），只在这里写变量名
  # key_env: "SHIQIAN_ASR_KEY"

# ==============================================================================
# 语音播报（TTS）：Edge-TTS 在线合成 + 系统语音引擎离线兜底
# ==============================================================================
tts:
  # zh-CN-XiaoxiaoNeural（温柔女生） | zh-CN-YunxiNeural（阳光男生）
  # zh-CN-YunjianNeural（沉稳男声） | zh-CN-XiaoyiNeural（活泼女生）
  voice: "zh-CN-XiaoxiaoNeural"
  rate: "+5%"
  # 关掉就只显示文字不发声（教室里不方便外放时用）
  enabled: true
  # 合成过的句子会缓存到这里，同一句金句第二次播报几乎零延迟
  cache_dir: "data/tts_cache"
  cache_limit: 300
  # 单句播报最多等多久（防止网络卡住拖死主流程）
  speak_timeout: 25
  # 单次合成超时：Edge-TTS 超过这个秒数就放弃，转离线语音
  synth_timeout: 6.0
  # 断网时是否回退到系统语音引擎（Windows 走 SAPI，需要 pip install pyttsx3）
  offline_fallback: true
  # 固定话术：启动时提前合成并缓存，断网也照播（播的是本地文件，不需要网络）
  fixed_phrases:
    welcome: "你好呀，我是时迁。说一句想被记住的话，我为你定格一个光影姿态。"
    retry: "没听清，请再说一遍。"
    listening: "我在听，请说。"
    busy: "正在处理上一位同学，请稍等。"
    bye: "谢谢你，再见。"
    ticket: "请收好小票，凭核销码到兑换台领取礼品。"

# ==============================================================================
# 语音交互策略（模块一新增）：半双工门闸 / 按键说话 / 过滤阈值
# ------------------------------------------------------------------------------
#  门闸：播报时一定不收音，否则机器人会把自己的声音识别成观众的话
#  一次只处理一个人：锁不住就回"请稍等"，不排队、不串音
# ==============================================================================
voice:
  # "vad"   -> 自动监听，靠人声检测判断起止（默认，适合人自己走过来的展台）
  # "enter" -> 按键说话：按回车开始说，说完再按回车（嘈杂现场更稳）
  ptt_mode: "vad"
  # 屏幕上是否显示"正在聆听"的明显提示
  show_indicator: true
  # 听不清时最多重录几轮
  max_rounds: 2
  # 重录前的提示语（会真的念出来，然后才继续听）
  retry_prompt: "没听清，请再说一遍。"
  # 按键说话模式下，等观众按下回车最多等几秒
  trigger_timeout: 30
  # 收音前等播报结束的最长时间（秒）；等不到也照播，避免现场卡死
  listen_gate_timeout: 5
  listen_hint: "请说话，说完停一下"
  gate:
    speak_drain_timeout: 2.0
  filter:
    # 少于 2 个字符（去掉标点后）判为"太短"
    min_chars: 2
    # 超过 40 个字符截断（不整句丢弃）
    max_chars: 40
    # Vosk 给出的平均置信度低于它就判"没听清"
    min_confidence: 0.55
    # 播报结束后多少秒内，收到高度相似的句子判为"自己的回声"
    echo_window_seconds: 25
    # 相似度阈值（0~1）
    echo_ratio: 0.8

# ==============================================================================
# 便携式热敏打印机（适配 inniFun P0 等蓝牙/USB 热敏打印机）
# ==============================================================================
printer:
  # "auto"      -> 优先通过电脑蓝牙连接 inniFun P0 打印；未连接时自动生成高清电子小票图
  # "image_only"-> 仅生成高清电子小票图片（方便用手机 inniFun App 选图打印）
  mode: "auto"
  bluetooth_name_keyword: "inniFun"
  serial_port: ""
  baudrate: 9600

# ==============================================================================
# 小票与核销码
# ==============================================================================
ticket:
  codes_csv_path: "data/codes.csv"
  records_csv_path: "data/issued_tickets.csv"
  # 首次启动自动生成的码数量（标准是 100 个唯一 6 位码）
  pool_size: 100
  # 剩余少于此数量开始提醒补码
  low_watermark: 10

# ==============================================================================
# 网页核销后台设置（3_点我启动网页核销后台_Windows.bat）
# 这里只有普通运行参数；登录口令来自 modules/core_auth.py 的源码常量。
# ==============================================================================
redeem:
  # 监听地址：
  #   "127.0.0.1" -> 只有这台电脑自己能打开（最安全，推荐活动时用本机/接平板投屏）
  #   "0.0.0.0"   -> 同一局域网内的手机、平板都能访问（方便，但上线前务必先改掉默认口令！）
  host: "127.0.0.1"
  port: 8090

  # 登录状态保持多久（分钟），超时自动退出，需重新输入口令
  session_minutes: 30
  # 同一个 IP 连续输错口令多少次后锁定、锁定多少秒
  login_max_fail: 5
  login_lock_seconds: 60

  # 核销后 codes.csv 里显示的状态文字（想改成"已领取"改这里即可）
  redeemed_status: "已兑换礼品"

  # 数据文件路径（和出票程序共用同一套文件）
  codes_csv_path: "data/codes.csv"
  records_csv_path: "data/issued_tickets.csv"
  redeem_log_csv_path: "data/redeem_log.csv"

